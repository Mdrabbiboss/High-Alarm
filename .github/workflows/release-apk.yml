name: Build APK + AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      # Uses your own key if the repo has these secrets:
      # KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
      # Otherwise falls back to the test key in ci/.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "SIGN_FILE=$RUNNER_TEMP/upload.jks" >> $GITHUB_ENV
            echo "SIGN_STORE_PW=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "SIGN_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "SIGN_KEY_PW=$KEY_PASSWORD" >> $GITHUB_ENV
          else
            echo "SIGN_FILE=${{ github.workspace }}/ci/highalarm-release.jks" >> $GITHUB_ENV
            echo "SIGN_STORE_PW=HighAlarm2026" >> $GITHUB_ENV
            echo "SIGN_ALIAS=highalarm" >> $GITHUB_ENV
            echo "SIGN_KEY_PW=HighAlarm2026" >> $GITHUB_ENV
          fi

      - name: Build debug APK, release APK and release AAB
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease bundleRelease \
            -PMYAPP_RELEASE_STORE_FILE="$SIGN_FILE" \
            -PMYAPP_RELEASE_STORE_PASSWORD="$SIGN_STORE_PW" \
            -PMYAPP_RELEASE_KEY_ALIAS="$SIGN_ALIAS" \
            -PMYAPP_RELEASE_KEY_PASSWORD="$SIGN_KEY_PW"

      - name: Collect outputs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/HighAlarm-release.apk
          cp app/build/outputs/apk/debug/*.apk out/HighAlarm-debug.apk
          cp app/build/outputs/bundle/release/*.aab out/HighAlarm-release.aab
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: HighAlarm-build-${{ github.run_number }}
          path: out/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: HighAlarm build ${{ github.run_number }}
          make_latest: true
          files: out/*
